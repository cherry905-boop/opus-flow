<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Opus Flow</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Opus Flow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css');
:root{
  --bg:#ffffff;
  --bg-soft:#f7f6f3;
  --bg-muted:#f1f1ef;
  --text:#37352f;
  --muted:#787774;
  --subtle:#9b9a97;
  --border:rgba(55,53,47,.09);
  --border-soft:rgba(55,53,47,.06);
  --blue-bg:#ddebf1;
  --blue-text:#183347;
  --green-bg:#ddedea;
  --green-text:#1b5147;
  --yellow-bg:#fbf3db;
  --yellow-text:#614a19;
  --red-bg:#fbe4e4;
  --red-text:#5c1f1f;
  --gray-bg:rgba(55,53,47,.06);
  --gray-text:#787774;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100%;background:var(--bg)}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
input,textarea,select{outline:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::selection{background:var(--blue-bg);color:var(--blue-text)}
.app{min-height:100vh;background:var(--bg);color:var(--text)}
.layout{max-width:1120px;margin:0 auto;min-height:100vh}
.main{padding:28px 20px 92px;max-width:720px;margin:0 auto}
.mobile-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--border);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.mobile-nav-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav-button{border:0;background:transparent;color:var(--subtle);font-size:12px;font-weight:400;padding:10px 4px;cursor:pointer}
.nav-button.active{color:var(--text);font-weight:650}
.sidebar{display:none}
.page-header{margin-bottom:24px}
.page-icon{font-size:28px;line-height:1;margin-bottom:10px}
.page-title{font-size:32px;font-weight:750;letter-spacing:-.4px;line-height:1.15;color:var(--text)}
.page-subtitle{font-size:14px;font-weight:400;color:var(--muted);margin-top:6px}
.grid{display:grid;gap:16px}
.desktop-grid{display:grid;gap:16px}
.properties{display:grid;grid-template-columns:88px 1fr;row-gap:8px;column-gap:16px;margin:0 0 26px}
.property-label{font-size:14px;color:var(--muted);font-weight:400}
.property-value{font-size:14px;color:var(--text);min-width:0}
.section{margin-top:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.section-title{font-size:14px;font-weight:650;color:var(--text)}
.section-action{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;min-height:43px;padding:10px 0;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .12s ease}
.row:first-child{border-top:1px solid var(--border-soft)}
.row:hover{background:var(--bg-soft)}
.row:active{background:var(--bg-muted)}
.marker{width:16px;flex:0 0 16px;color:var(--muted);font-size:14px;text-align:center}
.row-main{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:520;line-height:1.35;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-right{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;min-height:18px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:550;line-height:1.25;white-space:nowrap;background:var(--gray-bg);color:var(--gray-text)}
.pill.blue{background:var(--blue-bg);color:var(--blue-text)}
.pill.green{background:var(--green-bg);color:var(--green-text)}
.pill.yellow{background:var(--yellow-bg);color:var(--yellow-text)}
.pill.red{background:var(--red-bg);color:var(--red-text)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border-soft);margin:0 -20px 12px;padding:0 20px}
.tab{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:400;padding:8px 8px 9px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tab.active{color:var(--text);font-weight:650;border-bottom-color:var(--text)}
.button{border:0;background:var(--text);color:#fff;border-radius:6px;padding:9px 13px;font-size:13px;font-weight:650;cursor:pointer}
.button.secondary{background:var(--bg-muted);color:var(--text)}
.button.ghost{background:transparent;color:var(--muted)}
.button.danger{background:var(--red-bg);color:var(--red-text)}
.button.full{width:100%}
.button-row{display:flex;gap:8px;margin-top:18px}
.button-row .button{flex:1}
.field{display:block;margin-bottom:14px}
.label{font-size:14px;color:var(--muted);font-weight:400;margin-bottom:6px}
.input,.select,.textarea{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;padding:9px 10px;line-height:1.4}
.textarea{min-height:94px;resize:vertical;line-height:1.5}
.inline-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.progress{height:4px;border-radius:99px;background:var(--bg-muted);overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:99px;background:var(--text)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border-soft);border-left:1px solid var(--border-soft);margin-bottom:26px}
.calendar-head,.calendar-day{border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);text-align:center}
.calendar-head{font-size:12px;color:var(--muted);padding:7px 0}
.calendar-day{border-top:0;border-left:0;background:var(--bg);min-height:46px;padding:7px 0;color:var(--text);cursor:pointer}
.calendar-day.muted{color:var(--subtle)}
.calendar-day.today{box-shadow:inset 0 0 0 1.4px var(--text)}
.dot{width:5px;height:5px;border-radius:99px;background:var(--text);margin:4px auto 0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:13px 0}
.stat-value{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:17px;font-weight:650;color:var(--text)}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}
.overlay-inner{max-width:560px;margin:0 auto;min-height:100%;padding:20px 20px 34px}
.back{border:0;background:transparent;color:var(--muted);font-size:14px;padding:8px 0 16px;cursor:pointer}
.empty{color:var(--subtle);font-size:14px;font-weight:400}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;font-weight:550}
.muted{color:var(--muted)}
.score-grid{display:grid;grid-template-columns:1fr;gap:8px}
.checkline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text);margin:0 0 14px}
.choice-field{margin-bottom:14px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:6px}
.choice-grid.compact{grid-template-columns:repeat(5,1fr)}
.choice-button{border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:6px;min-height:38px;padding:8px 7px;font-size:13px;cursor:pointer}
.choice-button.active{background:var(--text);border-color:var(--text);color:#fff;font-weight:650}
.choice-button.warning.active{background:var(--yellow-bg);border-color:var(--yellow-bg);color:var(--yellow-text)}
.quick-checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.rule-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:8px}
.timer-card{border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:16px 0;margin:0 0 22px}
.timer-time{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:36px;font-weight:650;letter-spacing:0;line-height:1.1;margin-bottom:12px}
.metronome-card{border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:13px 0;margin:-8px 0 22px}
.metronome-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.metronome-title{font-size:14px;font-weight:650;color:var(--text)}
.metronome-state{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.metronome-dot{width:8px;height:8px;border-radius:99px;background:var(--border);transition:transform .08s ease,background .08s ease}
.metronome-dot.on{background:var(--text);transform:scale(1.35)}
.metronome-beats{display:flex;align-items:center;gap:5px;margin-left:2px}
.metronome-beat{width:6px;height:6px;border-radius:99px;background:var(--border);transition:background .08s ease,transform .08s ease}
.metronome-beat.accent{width:7px;height:7px}
.metronome-beat.active{background:var(--text);transform:scale(1.35)}
.metronome-controls{display:grid;grid-template-columns:38px 1fr 38px auto;gap:8px;align-items:center}
.metronome-bpm{display:grid;grid-template-columns:1fr 42px;align-items:center;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg)}
.metronome-bpm input{border:0;border-radius:0;text-align:center;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:17px;font-weight:650;padding:8px 6px}
.metronome-bpm span{font-size:11px;color:var(--muted);border-left:1px solid var(--border);padding:0 8px}
.metronome-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.metronome-mini{display:grid;grid-template-columns:42px 1fr;align-items:center;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--bg)}
.metronome-mini span{font-size:11px;color:var(--muted);padding:0 8px;border-right:1px solid var(--border)}
.metronome-mini select{border:0;border-radius:0;background:var(--bg);padding:8px 8px;color:var(--text)}
.metronome-volume{display:grid;grid-template-columns:44px 1fr 50px;gap:10px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
.metronome-volume input{width:100%;height:24px;accent-color:var(--text);cursor:pointer}
.metronome-volume input::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--bg-muted)}
.metronome-volume input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:99px;background:var(--text);margin-top:-7px}
.metronome-volume input::-moz-range-track{height:8px;border-radius:99px;background:var(--bg-muted)}
.metronome-volume input::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:99px;background:var(--text)}
.metronome-volume-value{font-family:ui-monospace,'SF Mono',Menlo,monospace;text-align:right;color:var(--text)}
.check-marker input{width:17px;height:17px;accent-color:var(--text)}
.practice-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px;max-width:260px}
.practice-mini-label{font-size:11px;color:var(--muted);margin-bottom:4px}
.practice-mini-input{padding:6px 8px}
.bpm-entry{display:grid;grid-template-columns:82px minmax(116px,1fr) 32px;gap:8px;align-items:end;margin-top:8px;max-width:360px}
.bpm-entry-remove{border:0;background:var(--bg-soft);color:var(--muted);border-radius:6px;height:36px;cursor:pointer}
.bpm-add{border:0;background:transparent;color:var(--muted);font-size:12px;margin-top:8px;cursor:pointer}
.count-stepper{display:grid;grid-template-columns:34px 1fr 44px;align-items:center;border:1px solid var(--border);border-radius:6px;overflow:hidden;min-height:36px;background:var(--bg)}
.count-button{border:0;background:var(--bg-soft);color:var(--text);font-size:13px;font-weight:650;height:100%;cursor:pointer}
.count-value{font-family:ui-monospace,'SF Mono',Menlo,monospace;text-align:center;font-size:14px;font-weight:650}
@media (hover:none){.row:hover{background:transparent}.row:active{background:var(--bg-soft)}}
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:220px 1fr;max-width:1120px}
  .sidebar{display:block;position:sticky;top:0;height:100vh;border-right:1px solid var(--border);padding:26px 18px;background:var(--bg)}
  .brand{font-size:16px;font-weight:720;margin-bottom:24px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-button{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:9px 10px;text-align:left;font-size:14px;cursor:pointer}
  .side-button.active{background:var(--bg-soft);color:var(--text);font-weight:650}
  .mobile-nav{display:none}
  .main{max-width:none;margin:0;padding:36px 36px 60px}
  .desktop-grid{grid-template-columns:1.1fr .9fr;align-items:start}
  .overlay{background:rgba(255,255,255,.76);backdrop-filter:blur(4px)}
  .overlay-inner{min-height:auto;margin:44px auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 16px 48px rgba(55,53,47,.12)}
}
</style>

    beatRef.current = 1;
    setBeat(1);
    playClick("accent");
    setRunning(true);
  };
  const stop = () => {
    if (tickRef.current) clearInterval(tickRef.current);
    tickRef.current = null;
    beatRef.current = 0;
    setBeat(0);
    setRunning(false);
  };
  return (
    <div className="metronome-card">
      <div className="metronome-top">
        <div className="metronome-title">메트로놈</div>
        <div className="metronome-state">
          <span className={`metronome-dot ${running && beat ? "on" : ""}`} />
          {running ? `${beat || 1}/${beatsPerMeasure}` : "대기"}
          <div className="metronome-beats">
            {Array.from({ length: beatsPerMeasure }).map((_, index) => (
              <span key={index} className={`metronome-beat ${index === 0 ? "accent" : ""} ${running && beat === index + 1 ? "active" : ""}`} />
            ))}
          </div>
        </div>
      </div>
      <div className="metronome-controls">
        <button className="button ghost" type="button" onClick={() => setBpmValue(bpm - 5)}>-5</button>
        <div className="metronome-bpm">
          <input
            type="number"
            min="30"
            max="240"
            value={bpmInput}
            onChange={(e) => setBpmInput(e.target.value)}
            onBlur={(e) => commitBpm(e.currentTarget.value)}
            onKeyDown={(e) => {
              if (e.key === "Enter") {
                commitBpm(e.currentTarget.value);
                e.currentTarget.blur();
              }
            }}
          />
          <span>BPM</span>
        </div>
        <button className="button ghost" type="button" onClick={() => setBpmValue(bpm + 5)}>+5</button>
        {running ? <button className="button secondary" type="button" onClick={stop}>정지</button> : <button className="button" type="button" onClick={start}>켜기</button>}
      </div>
      <div className="metronome-options">
        <div className="metronome-mini">
          <span>박자</span>
          <select value={timeSignature} onChange={(e) => setSignatureValue(e.target.value)}>
            {METRONOME_SIGNATURES.map((item) => <option key={item} value={item}>{item}</option>)}
          </select>
        </div>
        <div className="metronome-mini">
          <span>강세</span>
          <select value={timeSignature === "6/8" ? "1·4" : "1"} disabled>
            <option value="1">1박</option>
            <option value="1·4">1·4박</option>
          </select>
        </div>
      </div>
      <label className="metronome-volume">
        <span>볼륨</span>
        <input
          type="range"
          min="0"
          max="150"
          step="5"
          value={volume}
          onInput={(e) => setVolumeValue(e.currentTarget.value)}
          onChange={(e) => setVolumeValue(e.currentTarget.value)}
        />
        <span className="metronome-volume-value">{volume}%</span>
      </label>
    </div>
  );
}

function getStreak(dates, todayValue) {
  const set = new Set(dates);
  let count = 0;
  let cursor = todayValue;
  while (set.has(cursor)) {
    count += 1;
    cursor = shiftDate(cursor, -1);
  }
  return count;
}
function lastText(date) {
  if (!date) return "없음";
  const diff = Math.floor((parseDate(today()) - parseDate(date)) / 864e5);
  if (diff === 0) return "오늘";
  if (diff === 1) return "어제";
  return `${diff}일 전`;
}

function DataSettings(p) {
  const pieceSessionCount = p.pianoSessions.filter((session) => session.type === "piece").length;
  const simpleTechniqueSessionCount = p.pianoSessions.filter((session) => session.type === "technique").length;
  const exportBackup = () => {
    const data = {};
    ALL_BACKUP_KEYS.forEach((key) => { data[key] = readJSON(key, null); });
    data[KEYS.settings] = normalizeSettings(data[KEYS.settings] || defSettings);
    const backup = { schemaVersion: 8, exportedAt: new Date().toISOString(), appVersion: "piano-redesign", data };
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const filename = `opus-flow-backup-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.json`;
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };
  const importBackup = (event) => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let backup;
      try { backup = JSON.parse(ev.target.result); } catch (error) { alert("파일을 읽을 수 없습니다"); return; }
      const version = Number(backup && backup.schemaVersion);
      if (!backup || !backup.data || typeof backup.data !== "object" || ![1,2,3,4,5,6,7,8].includes(version)) {
        alert("지원하지 않는 백업 파일입니다");
        return;
      }
      if (!confirm("현재 데이터가 백업 파일 내용으로 교체됩니다. 계속하시겠어요?")) return;
      LEGACY_KEYS.forEach((key) => {
        if (Object.prototype.hasOwnProperty.call(backup.data, key)) writeJSON(key, backup.data[key]);
      });
      writeJSON(KEYS.pieces, backup.data[KEYS.pieces] || backup.data["of3-pieces"] || defPieces);
      writeJSON(KEYS.techniques, backup.data[KEYS.techniques] || backup.data["of3-techniques"] || defTechniques);
      writeJSON(KEYS.pianoSessions, backup.data[KEYS.pianoSessions] || (version < 4 ? migrateOldPianoSessions(backup.data) : null) || []);
      writeJSON(KEYS.techniquePlans, backup.data[KEYS.techniquePlans] || defTechniquePlans);
      writeJSON(KEYS.techniquePlanSessions, version >= 4 && Array.isArray(backup.data[KEYS.techniquePlanSessions]) ? backup.data[KEYS.techniquePlanSessions] : defTechniquePlanSessions);
      writeJSON(KEYS.techniquePractices, version >= 5 && Array.isArray(backup.data[KEYS.techniquePractices]) ? backup.data[KEYS.techniquePractices] : defTechniquePractices);
      writeJSON(KEYS.settings, normalizeSettings(backup.data[KEYS.settings] || defSettings));
      location.reload();
    };
    reader.readAsText(file);
    event.target.value = "";
  };
  return (
    <>
      <Section title="데이터 요약">
        <Row marker="♪" title={`피아노 곡 ${p.pieces.length}개 · 테크닉 항목 ${p.techniquePlans.length}개`} subtitle={`곡 세션 ${pieceSessionCount}개 · 보조 테크닉 ${simpleTechniqueSessionCount}개 · 테크닉 연습 ${p.techniquePractices.length}개`} />
        <Row marker="📅" title={`리뷰 ${p.reviews.length}개`} subtitle={`마지막 활동 ${p.lastActivity ? fullDate(p.lastActivity) : "없음"}`} />
      </Section>
      <Section title="백업/복원">
        <Row marker="↓" title="백업 내보내기" subtitle="schemaVersion 8 JSON" onClick={exportBackup} />
        <div className="row" style={{ cursor: "default" }}>
          <div className="marker">↑</div>
          <div className="row-main"><div className="row-title">백업 불러오기</div><div className="row-sub">기존 v1/v2/v3/v4/v5/v6/v7 백업 호환</div></div>
          <label className="button">선택<input type="file" accept="application/json,.json" style={{ display: "none" }} onChange={importBackup} /></label>
        </div>
      </Section>
    </>
  );
}
function migrateOldPianoSessions(data) {
  const pieceSessions = data["of3-piece-sessions"];
  const techniqueSessions = data["of3-technique-sessions"];
  if (!Array.isArray(pieceSessions) && !Array.isArray(techniqueSessions)) return null;
  return [
    ...(Array.isArray(pieceSessions) ? pieceSessions.map((s) => ({ id: s.id || uid(), date: s.date, type: "piece", targetId: s.pieceId, duration: s.duration, section: s.section || "", bpm: "", repetitions: "", note: s.note || "", feeling: s.feeling || "" })) : []),
    ...(Array.isArray(techniqueSessions) ? techniqueSessions.map((s) => ({ id: s.id || uid(), date: s.date, type: "technique", targetId: s.techniqueId, duration: s.duration, section: "", bpm: s.bpm || "", repetitions: s.repetitions || "", note: s.note || "", feeling: s.feeling || "" })) : []),
  ];
}

function PieceForm({ item, pieces, setPieces, setMonthFocus, monthFocus, onClose }) {
  const [form, setForm] = useState(item || { title: "", composer: "", opus: "", currentSection: "", status: "active", notes: "" });
  const save = () => {
    if (!form.title.trim()) return;
    if (form.id) setPieces(pieces.map((piece) => piece.id === form.id ? form : piece));
    else setPieces([...pieces, { ...form, id: uid(), createdAt: today() }]);
    onClose();
  };
  const remove = () => {
    if (!form.id || !confirm("곡을 삭제하시겠어요?")) return;
    setPieces(pieces.filter((piece) => piece.id !== form.id));
    setMonthFocus({ pieceIds: (monthFocus.pieceIds || []).filter((id) => id !== form.id) });
    onClose();
  };
  return <ItemFormFrame icon="🎹" title={form.id ? "곡 수정" : "새 곡"} form={form} setForm={setForm} save={save} remove={form.id && remove} fields="piece" />;
}
function PiecePracticeForm({ data, pieces, setPieces, setPianoSessions, timer, setTimer, onClose }) {
  const initialPieceId = data && data.pieceId || pieces[0] && pieces[0].id || "";
  const initialPiece = pieces.find((piece) => piece.id === initialPieceId) || pieces[0];
  const [form, setForm] = useState({
    date: today(),
    pieceId: initialPieceId,
    section: initialPiece && initialPiece.currentSection || "",
    bpm: data && data.bpm || 80,
    timeSignature: data && data.timeSignature || "4/4",
    repetitions: 0,
    feeling: "",
    note: "",
  });
  const [now, setNow] = useState(Date.now());
  const activeTimer = timer && timer.kind === "piece" ? timer : null;
  useEffect(() => {
    if (!activeTimer || !activeTimer.running) return;
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [activeTimer && activeTimer.running, activeTimer && activeTimer.startedAt]);
  const selectedPiece = pieces.find((piece) => piece.id === form.pieceId);
  const elapsedMs = activeTimer
    ? (Number(activeTimer.accumulatedMs) || 0) + (activeTimer.running && activeTimer.startedAt ? Math.max(0, now - Date.parse(activeTimer.startedAt)) : 0)
    : 0;
  const startTimer = () => {
    const stamp = new Date().toISOString();
    setTimer({ kind: "piece", targetId: form.pieceId, running: true, startedAt: stamp, firstStartedAt: activeTimer && activeTimer.firstStartedAt || stamp, accumulatedMs: activeTimer ? Math.round(elapsedMs) : 0 });
  };
  const pauseTimer = () => setTimer(activeTimer ? { ...activeTimer, running: false, startedAt: null, accumulatedMs: Math.round(elapsedMs) } : null);
  const resetTimer = () => setTimer(null);
  const changePiece = (pieceId) => {
    const nextPiece = pieces.find((piece) => piece.id === pieceId);
    setForm((prev) => ({ ...prev, pieceId, section: prev.section || nextPiece && nextPiece.currentSection || "" }));
  };
  const incrementReps = () => setForm((prev) => ({ ...prev, repetitions: (Number(prev.repetitions) || 0) + 1 }));
  const decrementReps = () => setForm((prev) => ({ ...prev, repetitions: Math.max(0, (Number(prev.repetitions) || 0) - 1) }));
  const save = () => {
    if (!form.pieceId) return;
    if (elapsedMs < 1000) {
      alert("먼저 연습 시작을 눌러 실제 시간을 기록해주세요.");
      return;
    }
    const endedAt = new Date().toISOString();
    const duration = Math.max(1, Math.round(elapsedMs / 60000));
    setPianoSessions((prev) => [...prev, {
      id: uid(),
      date: form.date,
      type: "piece",
      targetId: form.pieceId,
      duration,
      section: form.section,
      bpm: Number(form.bpm) || "",
      timeSignature: form.timeSignature,
      repetitions: Number(form.repetitions) || 0,
      note: form.note,
      feeling: form.feeling,
      startedAt: activeTimer && activeTimer.firstStartedAt || endedAt,
      endedAt,
      createdAt: endedAt,
    }]);
    if (form.section.trim()) {
      setPieces((prev) => prev.map((piece) => piece.id === form.pieceId ? { ...piece, currentSection: form.section } : piece));
    }
    setTimer(null);
    onClose();
  };
  if (!pieces.length) {
    return (
      <>
        <PageHeader icon="🎹" title="곡 연습" subtitle="먼저 곡을 추가해주세요" />
        <Empty text="연습할 곡 없음" />
      </>
    );
  }
  return (
    <>
      <PageHeader icon="🎹" title="곡 연습" subtitle={selectedPiece ? selectedPiece.title : "곡 선택"} />
      <div className="timer-card">
        <div className="timer-time">{clockText(elapsedMs)}</div>
        <div className="button-row" style={{ marginTop: 0 }}>
          {!activeTimer || !activeTimer.running ? <button className="button" onClick={startTimer}>{elapsedMs ? "이어하기" : "시작"}</button> : <button className="button secondary" onClick={pauseTimer}>일시정지</button>}
          <button className="button ghost" onClick={resetTimer}>초기화</button>
        </div>
      </div>
      <Metronome
        value={form.bpm}
        signature={form.timeSignature}
        onChange={(value) => setForm({ ...form, bpm: value })}
        onSignatureChange={(value) => setForm({ ...form, timeSignature: value })}
      />
      <Field label="날짜"><input type="date" className="input" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
      <Field label="곡"><select className="select" value={form.pieceId} onChange={(e) => changePiece(e.target.value)}>{pieces.map((piece) => <option key={piece.id} value={piece.id}>{piece.title}</option>)}</select></Field>
      <Field label="구간"><input className="input" value={form.section} placeholder="예: 1~40마디, 코다, 왼손 도약" onChange={(e) => setForm({ ...form, section: e.target.value })} /></Field>
      <Field label="구간 반복">

      ...form,
      mode: nextMode,
      keyOrder: nextMode === "key-number" ? TECHNIQUE_KEY_ORDER : [],

      {mode === "key-number" && <Field label="현재 키"><select className="select" value={form.currentKey || "C"} onChange={(e) => setForm({ ...form, currentKey: e.target.value })}>{TECHNIQUE_KEY_ORDER.map((key) => <option key={key} value={key}>{key}</option>)}</select></Field>}
      {mode !== "bpm-complete" && <Field label="현재 묶음"><select className="select" value={Number(form.currentGroupIndex) || 0} onChange={(e) => setForm({ ...form, currentGroupIndex: Number(e.target.value) })}>{groupOptions.map((group, index) => <option key={index} value={index}>{groupText(group)}번</option>)}</select></Field>}
      <div className="inline-fields">

function TechniquePracticeForm({ data, techniquePlans, setTechniquePractices, setTechniquePlanSessions, timer, setTimer, onClose }) {
  const availablePlans = techniquePlans.filter((plan) => plan.status === "active" && !plan.completed);
  const requestedIds = data && Array.isArray(data.planIds) ? data.planIds : [];
  const initialMetronomePlan = availablePlans.find((plan) => requestedIds.includes(plan.id)) || availablePlans[0];
  const defaultBpmEntry = (plan, repetitions = 0) => ({ id: uid(), bpm: Number(plan.currentBPM) || "", repetitions });
  const [checked, setChecked] = useState(() => Object.fromEntries(availablePlans.map((plan) => [plan.id, requestedIds.length ? requestedIds.includes(plan.id) : false])));
  const [bpmEntriesByPlan, setBpmEntriesByPlan] = useState(() => Object.fromEntries(availablePlans.map((plan) => [plan.id, [defaultBpmEntry(plan, requestedIds.includes(plan.id) ? 1 : 0)]])));
  const [form, setForm] = useState({
    date: today(),
    completedAll: true,
    evenness: 4,
    soundConsistency: 4,
    fingerIndependence: 4,
    weakFingerDrop: "none",
    collapse: "none",
    tension: 1,
    pain: "none",
    difficulty: "good",
    recordingId: "",
    metronomeBPM: Number(data && data.metronomeBPM) || Number(initialMetronomePlan && initialMetronomePlan.currentBPM) || 80,
    metronomeSignature: data && data.metronomeSignature || "4/4",
    note: "",
  });
  const [now, setNow] = useState(Date.now());
  const activeTimer = timer && timer.kind === "technique" ? timer : null;
  useEffect(() => {
    if (!activeTimer || !activeTimer.running) return;
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [activeTimer && activeTimer.running, activeTimer && activeTimer.startedAt]);
  const elapsedMs = activeTimer
    ? (Number(activeTimer.accumulatedMs) || 0) + (activeTimer.running && activeTimer.startedAt ? Math.max(0, now - Date.parse(activeTimer.startedAt)) : 0)
    : 0;
  const entriesForPlan = (plan) => {
    const entries = bpmEntriesByPlan[plan.id];
    return entries && entries.length ? entries : [{ id: `${plan.id}-fallback`, bpm: Number(plan.currentBPM) || "", repetitions: 0 }];
  };
  const totalRepetitionsForPlan = (planId) => sum(bpmEntriesByPlan[planId] || [], (entry) => entry.repetitions);
  const normalizedBpmEntries = (plan) => entriesForPlan(plan)
    .map((entry) => ({ bpm: Number(entry.bpm) || Number(plan.currentBPM) || 0, repetitions: Number(entry.repetitions) || 0 }))
    .filter((entry) => entry.bpm || entry.repetitions);
  const selectedPlans = availablePlans.filter((plan) => checked[plan.id] || totalRepetitionsForPlan(plan.id) > 0);
  const setPlanEntries = (plan, getNext, syncChecked = false) => setBpmEntriesByPlan((prev) => {
    const current = prev[plan.id] && prev[plan.id].length ? prev[plan.id] : [defaultBpmEntry(plan)];
    const next = getNext(current);
    if (syncChecked) setChecked((checks) => ({ ...checks, [plan.id]: sum(next, (entry) => entry.repetitions) > 0 }));
    return { ...prev, [plan.id]: next };
  });
  const togglePlan = (plan) => {
    const id = plan.id;
    const nextChecked = !checked[id];
    setChecked((prev) => ({ ...prev, [id]: nextChecked }));
    setPlanEntries(plan, (entries) => nextChecked
      ? entries.map((entry, index) => index === 0 ? { ...entry, repetitions: Math.max(1, Number(entry.repetitions) || 0) } : entry)
      : entries.map((entry) => ({ ...entry, repetitions: 0 })));
  };
  const updateBpmEntry = (plan, index, patch) => {
    setPlanEntries(plan, (entries) => entries.map((entry, entryIndex) => entryIndex === index ? { ...entry, ...patch } : entry));
  };
  const addBpmEntry = (plan) => {
    setChecked((prev) => ({ ...prev, [plan.id]: true }));
    setPlanEntries(plan, (entries) => [...entries, defaultBpmEntry(plan)]);
  };
  const removeBpmEntry = (plan, index) => {
    setPlanEntries(plan, (entries) => entries.length > 1 ? entries.filter((entry, entryIndex) => entryIndex !== index) : entries.map((entry) => ({ ...entry, repetitions: 0 })), true);
  };
  const incrementReps = (plan, index) => {
    setChecked((prev) => ({ ...prev, [plan.id]: true }));
    setPlanEntries(plan, (entries) => entries.map((entry, entryIndex) => entryIndex === index ? { ...entry, repetitions: (Number(entry.repetitions) || 0) + 1 } : entry));
  };
  const decrementReps = (plan, index) => {
    setPlanEntries(plan, (entries) => entries.map((entry, entryIndex) => entryIndex === index ? { ...entry, repetitions: Math.max(0, (Number(entry.repetitions) || 0) - 1) } : entry), true);
  };
  const startTimer = () => {
    const stamp = new Date().toISOString();
    setTimer({ kind: "technique", running: true, startedAt: stamp, firstStartedAt: activeTimer && activeTimer.firstStartedAt || stamp, accumulatedMs: activeTimer ? Math.round(elapsedMs) : 0 });
  };

  const resetTimer = () => setTimer(null);
  const markStable = () => setForm((prev) => ({
    ...prev,
    completedAll: true,
    evenness: 4,
    soundConsistency: 4,
    fingerIndependence: 4,
    weakFingerDrop: "none",
    collapse: "none",
    tension: 1,
    pain: "none",
    difficulty: "good",
  }));
  const markCaution = () => setForm((prev) => ({
    ...prev,
    completedAll: false,
    weakFingerDrop: prev.weakFingerDrop === "none" ? "mild" : prev.weakFingerDrop,
    collapse: prev.collapse === "none" ? "mild" : prev.collapse,
    tension: Math.max(Number(prev.tension) || 0, 3),
    pain: prev.pain === "none" ? "discomfort" : prev.pain,
    difficulty: ["easy", "good"].includes(prev.difficulty) ? "hard" : prev.difficulty,
  }));
  const save = () => {
    if (!selectedPlans.length) {
      alert("체크한 테크닉 항목이 없습니다.");
      return;
    }
    if (elapsedMs < 1000) {
      alert("먼저 연습 시작을 눌러 실제 시간을 기록해주세요.");
      return;
    }
    const practiceId = uid();
    const endedAt = new Date().toISOString();
    const duration = Math.max(1, Math.round(elapsedMs / 60000));
    const items = selectedPlans.map((plan) => {
      const bpmEntries = normalizedBpmEntries(plan);
      return {
        id: plan.id,
        label: techniqueTaskTitle(plan),
        stage: techniqueStageTitle(plan),
        bpmEntries,
        bpm: Math.max(0, ...bpmEntries.map((entry) => Number(entry.bpm) || 0)),
        repetitions: sum(bpmEntries, (entry) => entry.repetitions),
      };
    });

    const shared = {
      date: form.date,
      completedAll: Boolean(form.completedAll),
      evenness: Number(form.evenness) || 0,
      soundConsistency: Number(form.soundConsistency) || 0,
      fingerIndependence: Number(form.fingerIndependence) || 0,
      weakFingerDrop: form.weakFingerDrop,
      collapse: form.collapse,
      tension: Number(form.tension) || 0,
      pain: form.pain,
      difficulty: form.difficulty,
      recordingId: form.recordingId,
      metronomeBPM: Number(form.metronomeBPM) || 0,
      metronomeSignature: form.metronomeSignature,
      note: form.note,
    };
    setTechniquePractices((prev) => [...prev, {
      id: practiceId,
      ...shared,
      startedAt: activeTimer && activeTimer.firstStartedAt || endedAt,
      endedAt,
      duration,
      items,
      createdAt: endedAt,
    }]);
    setTechniquePlanSessions((prev) => [
      ...prev,
      ...selectedPlans.map((plan) => {
        const item = itemByPlanId[plan.id];
        return {
          id: uid(),
          practiceId,
          ...shared,
          planId: plan.id,
          planType: plan.type,
          stageId: techniqueStageId(plan),

          keyName: (plan.mode || techniqueModeForType(plan.type)) === "key-number" ? plan.currentKey || "C" : "",
          numbers: groupText(techniqueGroup(plan)),
          duration: 0,
          practiceDuration: duration,
          bpmEntries: item.bpmEntries,
          bpm: item.bpm,
          repetitions: item.repetitions,
          createdAt: endedAt,
        };
      }),
    ]);
    setTimer(null);
    onClose();
  };
  if (!availablePlans.length) {
    return (
      <>
        <PageHeader icon="🎹" title="테크닉 연습" subtitle="체크할 항목을 먼저 만들어주세요" />
        <Empty text="활성 테크닉 항목 없음" />
      </>
    );
  }
  return (
    <>
      <PageHeader icon="🎹" title="테크닉 연습" subtitle="시간을 재고, 끝나면 한 번에 체크" />
      <div className="timer-card">
        <div className="timer-time">{clockText(elapsedMs)}</div>
        <div className="button-row" style={{ marginTop: 0 }}>
          {!activeTimer || !activeTimer.running ? <button className="button" onClick={startTimer}>{elapsedMs ? "이어하기" : "시작"}</button> : <button className="button secondary" onClick={pauseTimer}>일시정지</button>}
          <button className="button ghost" onClick={resetTimer}>초기화</button>

          onChange={(value) => setForm({ ...form, weakFingerDrop: value })}
          options={Object.entries(DROP_LABELS).map(([value, label]) => ({ value, label }))}
          warningValues={["mild", "clear"]}
        />
        <ChoiceGroup
          label="무너짐"
          value={form.collapse}
          onChange={(value) => setForm({ ...form, collapse: value })}
          options={Object.entries(COLLAPSE_LABELS).map(([value, label]) => ({ value, label }))}
          warningValues={["mild", "clear"]}
        />
        <ChoiceGroup
          label="몸 긴장"
          value={form.tension}
          onChange={(value) => setForm({ ...form, tension: Number(value) })}
          options={[0,1,2,3,4,5].map((value) => ({ value, label: String(value) }))}
          compact
          warningValues={[3,4,5]}
        />
        <ChoiceGroup
          label="통증/저림"
          value={form.pain}
          onChange={(value) => setForm({ ...form, pain: value })}
          options={Object.entries(PAIN_LABELS).map(([value, label]) => ({ value, label }))}
          warningValues={["discomfort", "pain"]}
        />
        <ChoiceGroup
          label="난이도"
          value={form.difficulty}
          onChange={(value) => setForm({ ...form, difficulty: value })}
          options={Object.entries(DIFFICULTY_LABELS).map(([value, label]) => ({ value, label }))}
          warningValues={["hard", "tooHard"]}
        />
        <Field label="녹음/파일"><input className="input" value={form.recordingId} placeholder="선택 사항: 파일명이나 링크" onChange={(e) => setForm({ ...form, recordingId: e.target.value })} /></Field>
        <Field label="메모"><textarea className="textarea" value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} /></Field>
      </Section>
      <button className="button full" style={{ marginTop: 18 }} onClick={save}>연습 저장</button>
      <div className="rule-note">저장하면 연습 시간은 한 번만 기록되고, 체크한 항목들은 각자의 다음 단계 판정에 반영됩니다.</div>
    </>
  );
}
function TechniquePlanSessionForm({ data, techniquePlans, setTechniquePlanSessions, onClose }) {
  const activePlans = techniquePlans.filter((plan) => plan.status === "active" && !plan.completed);
  const firstPlan = techniquePlans.find((plan) => plan.id === (data && data.planId)) || activePlans[0] || techniquePlans[0];
  const [form, setForm] = useState({
    date: today(),
    planId: firstPlan ? firstPlan.id : "",
    duration: 20,
    bpm: firstPlan ? firstPlan.currentBPM || "" : "",
    completedAll: true,
    evenness: 4,
    soundConsistency: 4,
    fingerIndependence: 4,
    weakFingerDrop: "none",
    collapse: "none",
    tension: 1,
    pain: "none",
    difficulty: "good",
    recordingId: "",
    note: "",
    ...(data || {}),
  });
  if (!firstPlan) {
    return (
      <>
        <PageHeader icon="🎹" title="테크닉 평가" />
        <Empty text="먼저 훈련 플랜을 만들어야 합니다" />
      </>
    );
  }
  const plan = techniquePlans.find((candidate) => candidate.id === form.planId) || firstPlan;
  const qualityPass = techniqueSessionPasses(form, plan);
  const changePlan = (planId) => {
    const nextPlan = techniquePlans.find((candidate) => candidate.id === planId);
    setForm({ ...form, planId, bpm: nextPlan ? nextPlan.currentBPM || "" : "" });
  };
  const save = () => {
    if (!plan) return;
    const next = {
      ...form,
      id: uid(),
      planType: plan.type,
      stageId: techniqueStageId(plan),
      stageLabel: techniqueStageTitle(plan),
      keyName: plan.mode === "key-number" ? plan.currentKey || "C" : "",
      numbers: groupText(techniqueGroup(plan)),
      duration: Number(form.duration) || 0,
      bpm: Number(form.bpm) || 0,
      evenness: Number(form.evenness) || 0,
      soundConsistency: Number(form.soundConsistency) || 0,
      fingerIndependence: Number(form.fingerIndependence) || 0,
      tension: Number(form.tension) || 0,
      completedAll: Boolean(form.completedAll),
      createdAt: new Date().toISOString(),
    };
    setTechniquePlanSessions((prev) => [...prev, next]);
    onClose();
  };
  return (
    <>
      <PageHeader icon="🎹" title="연습 후 체크" subtitle={techniqueTaskTitle(plan)} />
      <Field label="훈련"><select className="select" value={form.planId} onChange={(e) => changePlan(e.target.value)}>{techniquePlans.map((item) => <option key={item.id} value={item.id}>{item.title}</option>)}</select></Field>
      <div className="inline-fields">
        <Field label="날짜"><input type="date" className="input" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
        <Field label="시간"><input type="number" className="input" value={form.duration} onChange={(e) => setForm({ ...form, duration: e.target.value })} /></Field>
      </div>
      <Field label="실제 BPM"><input type="number" className="input" value={form.bpm} onChange={(e) => setForm({ ...form, bpm: e.target.value })} /></Field>
      <label className="checkline"><input type="checkbox" checked={Boolean(form.completedAll)} onChange={(e) => setForm({ ...form, completedAll: e.target.checked })} />오늘 정한 범위를 끝까지 쳤다</label>
      <div className="score-grid">
        <ScoreSelect label="소리 고름" value={form.evenness} onChange={(value) => setForm({ ...form, evenness: value })} />
        <ScoreSelect label="음색 일정" value={form.soundConsistency} onChange={(value) => setForm({ ...form, soundConsistency: value })} />
        <ScoreSelect label="손가락 균형" value={form.fingerIndependence} onChange={(value) => setForm({ ...form, fingerIndependence: value })} />
      </div>
      <div className="inline-fields" style={{ marginTop: 14 }}>
        <Field label="특정 손가락"><select className="select" value={form.weakFingerDrop} onChange={(e) => setForm({ ...form, weakFingerDrop: e.target.value })}>{Object.entries(DROP_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}</select></Field>
        <Field label="무너짐"><select className="select" value={form.collapse} onChange={(e) => setForm({ ...form, collapse: e.target.value })}>{Object.entries(COLLAPSE_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}</select></Field>
      </div>
      <div className="inline-fields">
        <Field label="몸 긴장"><select className="select" value={form.tension} onChange={(e) => setForm({ ...form, tension: Number(e.target.value) })}>{[0,1,2,3,4,5].map((value) => <option key={value} value={value}>{value}</option>)}</select></Field>
        <Field label="통증/저림"><select className="select" value={form.pain} onChange={(e) => setForm({ ...form, pain: e.target.value })}>{Object.entries(PAIN_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}</select></Field>
      </div>
      <Field label="난이도"><select className="select" value={form.difficulty} onChange={(e) => setForm({ ...form, difficulty: e.target.value })}>{Object.entries(DIFFICULTY_LABELS).map(([value, label]) => <option key={value} value={value}>{label}</option>)}</select></Field>
      <Field label="녹음/파일"><input className="input" value={form.recordingId} placeholder="선택 사항: 파일명이나 링크" onChange={(e) => setForm({ ...form, recordingId: e.target.value })} /></Field>
      <Field label="메모"><textarea className="textarea" value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} /></Field>
      <Row marker={qualityPass ? "✓" : "·"} title={qualityPass ? "오늘 기록은 넘어가기 후보야" : "오늘은 같은 단계 유지가 좋아"} subtitle="같은 단계에서 후보 기록 2회와 날짜 2일이 모이면 다음으로 넘길 수 있어" />
      <button className="button full" style={{ marginTop: 18 }} onClick={save}>저장</button>
    </>
  );
}
function ScoreSelect({ label, value, onChange }) {
  return <ChoiceGroup label={label} value={value} onChange={(next) => onChange(Number(next))} options={[1,2,3,4,5].map((score) => ({ value: score, label: String(score) }))} compact warningValues={[1,2,3]} />;
}
function ItemFormFrame({ icon, title, form, setForm, save, remove, fields }) {
  return (
    <>
      <PageHeader icon={icon} title={title} />
      {fields === "piece" && <>
        <Field label="제목"><input className="input" value={form.title || ""} onChange={(e) => setForm({ ...form, title: e.target.value })} /></Field>
        <Field label="작곡가"><input className="input" value={form.composer || ""} onChange={(e) => setForm({ ...form, composer: e.target.value })} /></Field>
        <Field label="Opus"><input className="input" value={form.opus || ""} onChange={(e) => setForm({ ...form, opus: e.target.value })} /></Field>
        <Field label="현재 구간"><input className="input" value={form.currentSection || ""} onChange={(e) => setForm({ ...form, currentSection: e.target.value })} /></Field>
      </>}
      {fields === "technique" && <>
        <Field label="제목"><input className="input" value={form.title || ""} onChange={(e) => setForm({ ...form, title: e.target.value })} /></Field>
        <Field label="분류"><select className="select" value={form.category || "하농"} onChange={(e) => setForm({ ...form, category: e.target.value })}>{TECH_CATEGORIES.map((value) => <option key={value}>{value}</option>)}</select></Field>
        <div className="inline-fields">
          <Field label="현재 BPM"><input className="input" type="number" value={form.currentBPM || 0} onChange={(e) => setForm({ ...form, currentBPM: Number(e.target.value) || 0 })} /></Field>
          <Field label="목표 BPM"><input className="input" type="number" value={form.targetBPM || 0} onChange={(e) => setForm({ ...form, targetBPM: Number(e.target.value) || 0 })} /></Field>
        </div>
      </>}
      <Field label="상태"><select className="select" value={form.status || "active"} onChange={(e) => setForm({ ...form, status: e.target.value })}><option value="active">활성</option><option value="paused">일시중지</option><option value="archived">보관</option></select></Field>
      <Field label="메모"><textarea className="textarea" value={form.notes || ""} onChange={(e) => setForm({ ...form, notes: e.target.value })} /></Field>
      <div className="button-row"><button className="button" onClick={save}>저장</button>{remove && <button className="button danger" onClick={remove}>삭제</button>}</div>
    </>
  );
}
function PianoSessionForm({ data, pieces, techniques, setPianoSessions, setTechniques, onClose }) {
  const [form, setForm] = useState({ date: today(), type: "piece", targetId: pieces[0] && pieces[0].id || "", duration: 30, section: "", bpm: "", repetitions: "", note: "", feeling: "", ...(data || {}) });
  const targets = form.type === "piece" ? pieces : techniques;
  const save = () => {
    if (!form.targetId) return;
    const next = { ...form, duration: Number(form.duration) || 0, bpm: form.bpm === "" ? "" : Number(form.bpm) || 0, repetitions: form.repetitions === "" ? "" : Number(form.repetitions) || 0 };
    setPianoSessions((prev) => [...prev, { ...next, id: uid() }]);
    if (next.type === "technique" && next.bpm) {
      setTechniques((prev) => prev.map((tech) => tech.id === next.targetId ? { ...tech, currentBPM: Math.max(Number(tech.currentBPM) || 0, Number(next.bpm) || 0) } : tech));
    }
    onClose();
  };
  return (
    <>
      <PageHeader icon="🎹" title="피아노 세션" />
      <Field label="날짜"><input type="date" className="input" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} /></Field>
      <Field label="종류"><select className="select" value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value, targetId: e.target.value === "piece" ? (pieces[0] && pieces[0].id || "") : (techniques[0] && techniques[0].id || "") })}><option value="piece">곡</option><option value="technique">테크닉</option></select></Field>
      <Field label="항목"><select className="select" value={form.targetId} onChange={(e) => setForm({ ...form, targetId: e.target.value })}>{targets.map((item) => <option key={item.id} value={item.id}>{item.title}</option>)}</select></Field>
      <div className="inline-fields">
        <Field label="시간"><input type="number" className="input" value={form.duration} onChange={(e) => setForm({ ...form, duration: Number(e.target.value) || 0 })} /></Field>
        <Field label="BPM"><input type="number" className="input" value={form.bpm} onChange={(e) => setForm({ ...form, bpm: e.target.value })} /></Field>
      </div>
      <div className="inline-fields">
        <Field label="구간"><input className="input" value={form.section} onChange={(e) => setForm({ ...form, section: e.target.value })} /></Field>
        <Field label="반복"><input type="number" className="input" value={form.repetitions} onChange={(e) => setForm({ ...form, repetitions: e.target.value })} /></Field>
      </div>
      <Field label="느낌"><input className="input" value={form.feeling} onChange={(e) => setForm({ ...form, feeling: e.target.value })} /></Field>
      <Field label="메모"><textarea className="textarea" value={form.note} onChange={(e) => setForm({ ...form, note: e.target.value })} /></Field>
      <button className="button full" onClick={save}>저장</button>
    </>
  );
}
function ReviewForm({ item, reviews, setReviews, onClose }) {
  const [form, setForm] = useState(item || { weekStart: weekStart(today()), win: "", focus: "", memo: "" });
  const save = () => {
    if (form.id) setReviews(reviews.map((review) => review.id === form.id ? { ...form, updatedAt: today() } : review));
    else setReviews([...reviews, { ...form, id: uid(), createdAt: today() }]);
    onClose();
  };
  const remove = () => {
    if (!form.id || !confirm("리뷰를 삭제하시겠어요?")) return;
    setReviews(reviews.filter((review) => review.id !== form.id));
    onClose();
  };
  return (
    <>
      <PageHeader icon="📅" title="주간 리뷰" subtitle={fullDate(form.weekStart)} />
      <Field label="잘한 것"><textarea className="textarea" value={form.win || ""} onChange={(e) => setForm({ ...form, win: e.target.value })} /></Field>
      <Field label="다음 주 집중"><textarea className="textarea" value={form.focus || ""} onChange={(e) => setForm({ ...form, focus: e.target.value })} /></Field>
      <Field label="메모"><textarea className="textarea" value={form.memo || ""} onChange={(e) => setForm({ ...form, memo: e.target.value })} /></Field>
      <div className="button-row"><button className="button" onClick={save}>저장</button>{form.id && <button className="button danger" onClick={remove}>삭제</button>}</div>
    </>
  );
}
function DayDetail({ date, pianoSessions, techniquePractices, pianoItemName }) {
  const piano = pianoSessions.filter((session) => session.date === date);
  const techniquePracticeItems = techniquePractices.filter((session) => session.date === date);
  return (
    <>
      <PageHeader icon="📅" title={fullDate(date)} subtitle={`${piano.length + techniquePracticeItems.length}세션`} />
      <Section title="피아노">{piano.map((session) => <Row key={session.id} marker="♪" title={session.type === "technique" ? "보조 테크닉" : pianoItemName(session) || "피아노"} subtitle={session.type === "technique" ? `${minText(session.duration)} · ${pianoItemName(session) || "테크닉"} · ${session.feeling || session.note || "메모 없음"}` : pieceSessionText(session)} />)}{!piano.length && <Empty />}</Section>
      <Section title="테크닉 연습">{techniquePracticeItems.map((session) => <Row key={session.id} marker="✓" title="테크닉 연습" subtitle={[minText(session.duration), metronomeSessionText(session), practiceItemsText(session.items)].filter(Boolean).join(" · ")} />)}{!techniquePracticeItems.length && <Empty />}</Section>
    </>
  );
}
function FocusPicker({ pieces, techniques, monthFocus, setMonthFocus, onClose }) {
  const hasPiece = (id) => (monthFocus.pieceIds || []).includes(id);
  const hasTechnique = (id) => (monthFocus.techniqueIds || []).includes(id);
  return (
    <>
      <PageHeader icon="🎹" title="집중 항목" />
      <Section title="곡">{pieces.map((piece) => <Row key={piece.id} marker={hasPiece(piece.id) ? "✓" : "♪"} title={piece.title} subtitle={piece.composer || "작곡가 미정"} onClick={() => setMonthFocus({ pieceIds: hasPiece(piece.id) ? monthFocus.pieceIds.filter((id) => id !== piece.id) : [...(monthFocus.pieceIds || []), piece.id] })} />)}</Section>
      <Section title="테크닉">{techniques.map((technique) => <Row key={technique.id} marker={hasTechnique(technique.id) ? "✓" : "♪"} title={technique.title} subtitle={technique.category} onClick={() => setMonthFocus({ techniqueIds: hasTechnique(technique.id) ? monthFocus.techniqueIds.filter((id) => id !== technique.id) : [...(monthFocus.techniqueIds || []), technique.id] })} />)}</Section>
      <button className="button full" style={{ marginTop: 18 }} onClick={onClose}>완료</button>
    </>
  );
}
function PianoRoutineForm({ pieces, techniques, settings, updateSettings, onClose }) {
  const [form, setForm] = useState({ day: 1, kind: "piece", targetId: pieces[0] && pieces[0].id || "", duration: 30 });
  const targets = form.kind === "piece" ? pieces : techniques;
  const save = () => {
    updateSettings({ pianoRoutine: [...settings.pianoRoutine, { ...form, id: uid(), duration: Number(form.duration) || 30 }] });
    onClose();
  };
  return (
    <>
      <PageHeader icon="🎹" title="피아노 루틴 추가" />
      <RoutineCommon form={form} setForm={setForm} />
      <Field label="종류"><select className="select" value={form.kind} onChange={(e) => setForm({ ...form, kind: e.target.value, targetId: e.target.value === "piece" ? (pieces[0] && pieces[0].id || "") : (techniques[0] && techniques[0].id || "") })}><option value="piece">곡</option><option value="technique">테크닉</option></select></Field>
      <Field label="항목"><select className="select" value={form.targetId} onChange={(e) => setForm({ ...form, targetId: e.target.value })}>{targets.map((item) => <option key={item.id} value={item.id}>{item.title}</option>)}</select></Field>
      <Field label="목표 시간"><input className="input" type="number" value={form.duration} onChange={(e) => setForm({ ...form, duration: e.target.value })} /></Field>
      <button className="button full" onClick={save}>추가</button>
    </>
  );
}
function RoutineCommon({ form, setForm }) {
  return <Field label="요일"><select className="select" value={form.day} onChange={(e) => setForm({ ...form, day: Number(e.target.value) })}>{DAYS.map((day, index) => <option key={day} value={index}>{day}요일</option>)}</select></Field>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
