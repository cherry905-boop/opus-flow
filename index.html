<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Opus Flow</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Opus Flow">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎹</text></svg>">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css');
:root{
  --bg:#ffffff;
  --bg-soft:#f7f6f3;
  --bg-muted:#f1f1ef;
  --text:#37352f;
  --muted:#787774;
  --subtle:#9b9a97;
  --border:rgba(55,53,47,.09);
  --border-soft:rgba(55,53,47,.06);
  --blue-bg:#ddebf1;
  --blue-text:#183347;
  --green-bg:#ddedea;
  --green-text:#1b5147;
  --yellow-bg:#fbf3db;
  --yellow-text:#614a19;
  --red-bg:#fbe4e4;
  --red-text:#5c1f1f;
  --gray-bg:rgba(55,53,47,.06);
  --gray-text:#787774;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{min-height:100%;background:var(--bg)}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
input,textarea,select{outline:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
::selection{background:var(--blue-bg);color:var(--blue-text)}
.app{min-height:100vh;background:var(--bg);color:var(--text)}
.layout{max-width:1120px;margin:0 auto;min-height:100vh}
.main{padding:28px 20px 92px;max-width:720px;margin:0 auto}
.mobile-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;border-top:1px solid var(--border);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 0 calc(8px + env(safe-area-inset-bottom))}
.mobile-nav-inner{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav-button{border:0;background:transparent;color:var(--subtle);font-size:12px;font-weight:400;padding:10px 4px;cursor:pointer}
.nav-button.active{color:var(--text);font-weight:650}
.sidebar{display:none}
.page-header{margin-bottom:24px}
.page-icon{font-size:28px;line-height:1;margin-bottom:10px}
.page-title{font-size:32px;font-weight:750;letter-spacing:-.4px;line-height:1.15;color:var(--text)}
.page-subtitle{font-size:14px;font-weight:400;color:var(--muted);margin-top:6px}
.grid{display:grid;gap:16px}
.desktop-grid{display:grid;gap:16px}
.properties{display:grid;grid-template-columns:88px 1fr;row-gap:8px;column-gap:16px;margin:0 0 26px}
.property-label{font-size:14px;color:var(--muted);font-weight:400}
.property-value{font-size:14px;color:var(--text);min-width:0}
.section{margin-top:26px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.section-title{font-size:14px;font-weight:650;color:var(--text)}
.section-action{border:0;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;min-height:43px;padding:10px 0;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .12s ease}
.row:first-child{border-top:1px solid var(--border-soft)}
.row:hover{background:var(--bg-soft)}
.row:active{background:var(--bg-muted)}
.marker{width:16px;flex:0 0 16px;color:var(--muted);font-size:14px;text-align:center}
.row-main{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:520;line-height:1.35;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12px;color:var(--muted);line-height:1.35;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-right{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;min-height:18px;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:550;line-height:1.25;white-space:nowrap;background:var(--gray-bg);color:var(--gray-text)}
.pill.blue{background:var(--blue-bg);color:var(--blue-text)}
.pill.green{background:var(--green-bg);color:var(--green-text)}
.pill.yellow{background:var(--yellow-bg);color:var(--yellow-text)}
.pill.red{background:var(--red-bg);color:var(--red-text)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border-soft);margin:0 -20px 12px;padding:0 20px}
.tab{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:400;padding:8px 8px 9px;border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.tab.active{color:var(--text);font-weight:650;border-bottom-color:var(--text)}
.button{border:0;background:var(--text);color:#fff;border-radius:6px;padding:9px 13px;font-size:13px;font-weight:650;cursor:pointer}
.button.secondary{background:var(--bg-muted);color:var(--text)}
.button.ghost{background:transparent;color:var(--muted)}
.button.danger{background:var(--red-bg);color:var(--red-text)}
.button.full{width:100%}
.button-row{display:flex;gap:8px;margin-top:18px}
.button-row .button{flex:1}
.field{display:block;margin-bottom:14px}
.label{font-size:14px;color:var(--muted);font-weight:400;margin-bottom:6px}
.input,.select,.textarea{width:100%;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;padding:9px 10px;line-height:1.4}
.textarea{min-height:94px;resize:vertical;line-height:1.5}
.inline-fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.progress{height:4px;border-radius:99px;background:var(--bg-muted);overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:99px;background:var(--text)}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border-soft);border-left:1px solid var(--border-soft);margin-bottom:26px}
.calendar-head,.calendar-day{border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);text-align:center}
.calendar-head{font-size:12px;color:var(--muted);padding:7px 0}
.calendar-day{border-top:0;border-left:0;background:var(--bg);min-height:46px;padding:7px 0;color:var(--text);cursor:pointer}
.calendar-day.muted{color:var(--subtle)}
.calendar-day.today{box-shadow:inset 0 0 0 1.4px var(--text)}
.dot{width:5px;height:5px;border-radius:99px;background:var(--text);margin:4px auto 0}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:26px}
.stat{border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);padding:13px 0}
.stat-value{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:17px;font-weight:650;color:var(--text)}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px}
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}
.overlay-inner{max-width:560px;margin:0 auto;min-height:100%;padding:20px 20px 34px}
.back{border:0;background:transparent;color:var(--muted);font-size:14px;padding:8px 0 16px;cursor:pointer}
.empty{color:var(--subtle);font-size:14px;font-weight:400}
.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:13px;font-weight:550}
.muted{color:var(--muted)}
@media (hover:none){.row:hover{background:transparent}.row:active{background:var(--bg-soft)}}
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:220px 1fr;max-width:1120px}
  .sidebar{display:block;position:sticky;top:0;height:100vh;border-right:1px solid var(--border);padding:26px 18px;background:var(--bg)}
  .brand{font-size:16px;font-weight:720;margin-bottom:24px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-button{border:0;background:transparent;color:var(--muted);border-radius:6px;padding:9px 10px;text-align:left;font-size:14px;cursor:pointer}
  .side-button.active{background:var(--bg-soft);color:var(--text);font-weight:650}
  .mobile-nav{display:none}
  .main{max-width:none;margin:0;padding:36px 36px 60px}
  .desktop-grid{grid-template-columns:1.1fr .9fr;align-items:start}
  .overlay{background:rgba(255,255,255,.76);backdrop-filter:blur(4px)}
  .overlay-inner{min-height:auto;margin:44px auto;background:var(--bg);border:1px solid var(--border);border-radius:8px;box-shadow:0 16px 48px rgba(55,53,47,.12)}
}
</style>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useMemo, useState, useEffect } = React;

const LEGACY_KEYS = [
  "of3-works",
  "of3-sessions",
  "of3-reviews",
  "of3-cats",
  "of3-routine",
  "of3-goals",
  "of3-horizons",
  "of3-timer",
];
const KEYS = {
  reviews: "of3-reviews",
  pieces: "of3-piano-pieces",
  techniques: "of3-piano-techniques",
  pianoSessions: "of3-piano-sessions",
  exercises: "of3-exercises",
  exerciseSessions: "of3-exercise-sessions",
  settings: "of3-settings",
};
const NEW_KEYS = [KEYS.pieces, KEYS.techniques, KEYS.pianoSessions, KEYS.exercises, KEYS.exerciseSessions, KEYS.settings];
const ALL_BACKUP_KEYS = [...LEGACY_KEYS, ...NEW_KEYS];

const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
const DAYS_FULL = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
const PIANO_STATUS = { active: "활성", paused: "일시중지", archived: "보관" };
const EXERCISE_STATUS = { active: "활성", paused: "일시중지", archived: "보관" };
const TECH_CATEGORIES = ["하농", "피쉬나", "체르니", "스케일", "아르페지오", "기타"];
const EXERCISE_CATEGORIES = ["근력", "유산소", "코어", "스트레칭", "재활", "기타"];
const EXERCISE_UNITS = ["회", "kg", "분", "km", "초"];

const defPieces = [
  { id: "piece-1", title: "발라드 1번", composer: "쇼팽", opus: "Op. 23", currentSection: "1~80마디", status: "active", notes: "큰 구조와 호흡을 먼저 잡기", createdAt: "2026-05-01" },
  { id: "piece-2", title: "평균율 1권 C장조 프렐류드", composer: "바흐", opus: "BWV 846", currentSection: "전곡", status: "paused", notes: "", createdAt: "2026-05-01" },
];
const defTechniques = [
  { id: "tech-1", title: "5번", category: "하농", targetBPM: 110, currentBPM: 100, status: "active", notes: "손목 힘 빼고 균일하게", createdAt: "2026-05-01" },
  { id: "tech-2", title: "C장조", category: "스케일", targetBPM: 88, currentBPM: 76, status: "active", notes: "", createdAt: "2026-05-01" },
];
const defPianoSessions = [
  { id: "ps-1", date: "2026-05-01", type: "piece", targetId: "piece-1", duration: 45, section: "1~40마디", bpm: "", repetitions: "", note: "", feeling: "큰 흐름 확인" },
  { id: "ps-2", date: "2026-05-02", type: "piece", targetId: "piece-1", duration: 60, section: "1~80마디", bpm: "", repetitions: "", note: "", feeling: "중간부 연결 개선" },
  { id: "ps-3", date: "2026-05-03", type: "technique", targetId: "tech-1", duration: 20, section: "", bpm: 100, repetitions: 5, note: "", feeling: "균일함 개선" },
];
const defExercises = [
  { id: "ex-1", name: "스쿼트", category: "근력", unit: "kg", notes: "깊이보다 정렬 우선", status: "active", createdAt: "2026-05-01" },
  { id: "ex-2", name: "플랭크", category: "코어", unit: "초", notes: "", status: "active", createdAt: "2026-05-01" },
  { id: "ex-3", name: "걷기", category: "유산소", unit: "km", notes: "", status: "active", createdAt: "2026-05-01" },
];
const defExerciseSessions = [
  { id: "es-1", date: "2026-05-01", exerciseId: "ex-1", sets: 3, reps: 12, weight: 20, duration: "", distance: "", note: "", feeling: "가볍게" },
  { id: "es-2", date: "2026-05-03", exerciseId: "ex-2", sets: 3, reps: "", weight: "", duration: 3, distance: "", note: "60초씩", feeling: "복부 집중" },
];
const defSettings = {
  goals: { weeklyPianoMinutes: 240, weeklyExerciseCount: 3 },
  monthlyFocus: {
    "2026-05": {
      intent: "발라드 1번의 큰 구조를 잡고, 하농 5번과 C장조 스케일을 짧게 자주 유지한다.",
      pieceIds: ["piece-1"],
      techniqueIds: ["tech-1", "tech-2"],
    },
  },
  pianoRoutine: [
    { id: "pr-1", day: 1, kind: "piece", targetId: "piece-1", duration: 45 },
    { id: "pr-2", day: 3, kind: "technique", targetId: "tech-1", duration: 20 },
    { id: "pr-3", day: 5, kind: "piece", targetId: "piece-1", duration: 45 },
  ],
  exerciseRoutine: [
    { id: "er-1", day: 1, exerciseId: "ex-1", sets: 3, reps: 12 },
    { id: "er-2", day: 3, exerciseId: "ex-2", sets: 3, reps: 60 },
    { id: "er-3", day: 6, exerciseId: "ex-3", duration: 40 },
  ],
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const readJSON = (key, fallback) => {
  try {
    const raw = localStorage.getItem(key);
    return raw == null ? fallback : JSON.parse(raw);
  } catch (error) {
    return fallback;
  }
};
const writeJSON = (key, value) => {
  try {
    if (value === undefined || value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(value));
  } catch (error) {}
};
function useStored(key, fallback) {
  const [value, setValue] = useState(() => readJSON(key, fallback));
  useEffect(() => writeJSON(key, value), [key, value]);
  return [value, setValue];
}
const dateKey = (date) => {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
};
const today = () => dateKey(new Date());
const parseDate = (value) => new Date(`${value}T00:00:00`);
const shiftDate = (value, amount) => {
  const d = parseDate(value);
  d.setDate(d.getDate() + amount);
  return dateKey(d);
};
const weekStart = (value) => {
  const d = parseDate(value);
  d.setDate(d.getDate() - d.getDay());
  return dateKey(d);
};
const weekDates = (value) => Array.from({ length: 7 }, (_, index) => shiftDate(weekStart(value), index));
const monthKey = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}`;
const shiftMonth = (ym, amount) => {
  const [year, month] = ym.split("-").map(Number);
  return monthKey(new Date(year, month - 1 + amount, 1));
};
const monthTitle = (ym) => {
  const [year, month] = ym.split("-").map(Number);
  return `${year}년 ${month}월`;
};
const monthDates = (ym) => {
  const [year, month] = ym.split("-").map(Number);
  const first = new Date(year, month - 1, 1);
  const last = new Date(year, month, 0);
  const dates = [];
  for (let i = 0; i < first.getDay(); i++) dates.push(shiftDate(dateKey(first), i - first.getDay()));
  for (let d = 1; d <= last.getDate(); d++) dates.push(dateKey(new Date(year, month - 1, d)));
  while (dates.length % 7) dates.push(shiftDate(dateKey(last), dates.length - first.getDay() - last.getDate() + 1));
  return dates;
};
const fullDate = (value) => {
  const d = parseDate(value);
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS_FULL[d.getDay()]}`;
};
const shortDate = (value) => {
  const d = parseDate(value);
  return `${d.getMonth() + 1}.${d.getDate()}`;
};
const minText = (minutes) => {
  const value = Number(minutes) || 0;
  if (value < 60) return `${value}m`;
  const h = Math.floor(value / 60);
  const m = value % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
};
const sum = (items, getValue) => items.reduce((total, item) => total + (Number(getValue(item)) || 0), 0);
const statusClass = (status) => status === "active" ? "blue" : status === "archived" ? "red" : "";
const byDateDesc = (a, b) => (b.date || "").localeCompare(a.date || "");
const normalizeSettings = (settings) => ({
  goals: { ...defSettings.goals, ...((settings && settings.goals) || {}) },
  monthlyFocus: { ...defSettings.monthlyFocus, ...((settings && settings.monthlyFocus) || {}) },
  pianoRoutine: Array.isArray(settings && settings.pianoRoutine) ? settings.pianoRoutine : defSettings.pianoRoutine,
  exerciseRoutine: Array.isArray(settings && settings.exerciseRoutine) ? settings.exerciseRoutine : defSettings.exerciseRoutine,
});

function PageHeader({ icon, title, subtitle }) {
  return (
    <header className="page-header">
      <div className="page-icon">{icon}</div>
      <h1 className="page-title">{title}</h1>
      {subtitle && <div className="page-subtitle">{subtitle}</div>}
    </header>
  );
}
function Properties({ rows }) {
  return (
    <div className="properties">
      {rows.map((row) => (
        <React.Fragment key={row.label}>
          <div className="property-label">{row.label}</div>
          <div className="property-value">{row.value || "-"}</div>
        </React.Fragment>
      ))}
    </div>
  );
}
function Section({ title, action, children }) {
  return (
    <section className="section">
      <div className="section-head">
        <div className="section-title">{title}</div>
        {action}
      </div>
      <div>{React.Children.toArray(children).filter(Boolean)}</div>
    </section>
  );
}
function Row({ marker, title, subtitle, right, onClick, children }) {
  return (
    <div className="row" onClick={onClick}>
      <div className="marker">{marker}</div>
      <div className="row-main">
        <div className="row-title">{title}</div>
        {subtitle && <div className="row-sub">{subtitle}</div>}
        {children}
      </div>
      {right && <div className="row-right">{right}</div>}
    </div>
  );
}
function Pill({ children, tone = "" }) {
  return <span className={`pill ${tone}`}>{children}</span>;
}
function Tabs({ value, onChange, items }) {
  return (
    <div className="tabs">
      {items.map((item) => <button key={item.value} className={`tab ${value === item.value ? "active" : ""}`} onClick={() => onChange(item.value)}>{item.label}</button>)}
    </div>
  );
}
function Progress({ value }) {
  return <div className="progress"><div className="progress-fill" style={{ width: `${Math.max(0, Math.min(100, value))}%` }} /></div>;
}
function Field({ label, children }) {
  return <label className="field"><div className="label">{label}</div>{children}</label>;
}
function Empty({ text = "항목 없음" }) {
  return <Row marker="·" title={<span className="empty">{text}</span>} />;
}

function App() {
  const [pieces, setPieces] = useStored(KEYS.pieces, defPieces);
  const [techniques, setTechniques] = useStored(KEYS.techniques, defTechniques);
  const [pianoSessions, setPianoSessions] = useStored(KEYS.pianoSessions, defPianoSessions);
  const [exercises, setExercises] = useStored(KEYS.exercises, defExercises);
  const [exerciseSessions, setExerciseSessions] = useStored(KEYS.exerciseSessions, defExerciseSessions);
  const [reviews, setReviews] = useStored(KEYS.reviews, []);
  const [settingsRaw, setSettingsRaw] = useStored(KEYS.settings, defSettings);
  const settings = normalizeSettings(settingsRaw);
  const updateSettings = (patch) => setSettingsRaw((prev) => normalizeSettings({ ...normalizeSettings(prev), ...patch }));

  const [tab, setTab] = useState("today");
  const [screen, setScreen] = useState(null);
  const [pianoView, setPianoView] = useState("month");
  const [exerciseView, setExerciseView] = useState("today");
  const [settingsView, setSettingsView] = useState("libraries");
  const [calendarMode, setCalendarMode] = useState("week");
  const [calendarAnchor, setCalendarAnchor] = useState(today());
  const [selectedMonth, setSelectedMonth] = useState(monthKey(new Date()));

  const td = today();
  const ws = weekStart(td);
  const we = shiftDate(ws, 7);
  const pieceMap = useMemo(() => Object.fromEntries(pieces.map((item) => [item.id, item])), [pieces]);
  const techniqueMap = useMemo(() => Object.fromEntries(techniques.map((item) => [item.id, item])), [techniques]);
  const exerciseMap = useMemo(() => Object.fromEntries(exercises.map((item) => [item.id, item])), [exercises]);
  const pianoItemName = (session) => session.type === "piece" ? (pieceMap[session.targetId] && pieceMap[session.targetId].title) : (techniqueMap[session.targetId] && techniqueMap[session.targetId].title);
  const weekPianoSessions = pianoSessions.filter((session) => session.date >= ws && session.date < we);
  const weekExerciseSessions = exerciseSessions.filter((session) => session.date >= ws && session.date < we);
  const weekPianoMinutes = sum(weekPianoSessions, (session) => session.duration);
  const activityDates = [...pianoSessions.map((s) => s.date), ...exerciseSessions.map((s) => s.date)].filter(Boolean);
  const lastActivity = activityDates.slice().sort().slice(-1)[0] || null;
  const streak = getStreak(activityDates, td);
  const monthFocus = settings.monthlyFocus[selectedMonth] || { intent: "", pieceIds: [], techniqueIds: [] };
  const setMonthFocus = (patch) => updateSettings({ monthlyFocus: { ...settings.monthlyFocus, [selectedMonth]: { ...monthFocus, ...patch } } });
  const openTab = (id) => { setTab(id); setScreen(null); };
  const common = {
    pieces, setPieces, techniques, setTechniques, pianoSessions, setPianoSessions,
    exercises, setExercises, exerciseSessions, setExerciseSessions,
    reviews, setReviews, settings, updateSettings,
    td, ws, we, pieceMap, techniqueMap, exerciseMap, pianoItemName,
    weekPianoMinutes, weekExerciseSessions, streak, lastActivity,
    selectedMonth, setSelectedMonth, monthFocus, setMonthFocus,
    screen, setScreen, pianoView, setPianoView, exerciseView, setExerciseView,
    settingsView, setSettingsView, calendarMode, setCalendarMode, calendarAnchor, setCalendarAnchor,
    openTab,
  };

  const navItems = [
    { id: "today", label: "오늘" },
    { id: "piano", label: "피아노" },
    { id: "exercise", label: "운동" },
    { id: "record", label: "기록" },
    { id: "settings", label: "설정" },
  ];
  return (
    <div className="app">
      <div className="layout">
        <aside className="sidebar">
          <div className="brand">Opus Flow</div>
          <nav className="side-nav">
            {navItems.map((item) => <button key={item.id} className={`side-button ${tab === item.id ? "active" : ""}`} onClick={() => openTab(item.id)}>{item.label}</button>)}
          </nav>
        </aside>
        <main className="main">
          {tab === "today" && <TodayView {...common} />}
          {tab === "piano" && <PianoView {...common} />}
          {tab === "exercise" && <ExerciseView {...common} />}
          {tab === "record" && <RecordView {...common} />}
          {tab === "settings" && <SettingsView {...common} />}
        </main>
      </div>
      <nav className="mobile-nav"><div className="mobile-nav-inner">
        {navItems.map((item) => <button key={item.id} className={`nav-button ${tab === item.id ? "active" : ""}`} onClick={() => openTab(item.id)}>{item.label}</button>)}
      </div></nav>
      {screen && <Overlay screen={screen} onClose={() => setScreen(null)} {...common} />}
    </div>
  );
}

function getStreak(dates, todayValue) {
  const set = new Set(dates);
  let count = 0;
  let cursor = todayValue;
  while (set.has(cursor)) {
    count += 1;
    cursor = shiftDate(cursor, -1);
  }
  return count;
}
function lastText(date) {
  if (!date) return "없음";
  const diff = Math.floor((parseDate(today()) - parseDate(date)) / 864e5);
  if (diff === 0) return "오늘";
  if (diff === 1) return "어제";
  return `${diff}일 전`;
}
function todayRoutineItems(settings, day, pieceMap, techniqueMap, exerciseMap) {
  const piano = settings.pianoRoutine.filter((item) => item.day === day).map((item) => ({
    id: item.id,
    kind: "piano",
    title: item.kind === "piece" ? (pieceMap[item.targetId] && pieceMap[item.targetId].title) || "삭제된 곡" : (techniqueMap[item.targetId] && techniqueMap[item.targetId].title) || "삭제된 테크닉",
    subtitle: item.kind === "piece" ? "피아노 곡" : "피아노 테크닉",
    marker: "♪",
    source: item,
  }));
  const exercise = settings.exerciseRoutine.filter((item) => item.day === day).map((item) => ({
    id: item.id,
    kind: "exercise",
    title: (exerciseMap[item.exerciseId] && exerciseMap[item.exerciseId].name) || "삭제된 운동",
    subtitle: "운동 루틴",
    marker: "□",
    source: item,
  }));
  return [...piano, ...exercise];
}

function TodayView(p) {
  const day = parseDate(p.td).getDay();
  const routine = todayRoutineItems(p.settings, day, p.pieceMap, p.techniqueMap, p.exerciseMap);
  const todayPiano = p.pianoSessions.filter((session) => session.date === p.td);
  const todayExercise = p.exerciseSessions.filter((session) => session.date === p.td);
  const completedTitles = new Set([
    ...todayPiano.map((session) => `${session.type}:${session.targetId}`),
    ...todayExercise.map((session) => `exercise:${session.exerciseId}`),
  ]);
  return (
    <>
      <PageHeader icon="🌤️" title="오늘" subtitle={fullDate(p.td)} />
      <Properties rows={[
        { label: "완료", value: `${todayPiano.length + todayExercise.length} 세션` },
        { label: "루틴", value: `${routine.length}개` },
        { label: "마지막 활동", value: lastText(p.lastActivity) },
      ]} />
      <Section title="오늘 루틴">
        {routine.map((item) => {
          const completed = item.kind === "piano"
            ? completedTitles.has(`${item.source.kind}:${item.source.targetId}`)
            : completedTitles.has(`exercise:${item.source.exerciseId}`);
          return (
            <Row
              key={item.id}
              marker={completed ? "✓" : item.marker}
              title={item.title}
              subtitle={item.subtitle}
              right={<Pill tone={item.kind === "piano" ? "blue" : "green"}>{completed ? "완료" : item.kind === "piano" ? "피아노" : "운동"}</Pill>}
              onClick={() => item.kind === "piano"
                ? p.setScreen({ type: "piano-session", data: { type: item.source.kind, targetId: item.source.targetId, duration: item.source.duration || 30 } })
                : p.setScreen({ type: "exercise-session", data: { exerciseId: item.source.exerciseId, sets: item.source.sets || "", reps: item.source.reps || "", duration: item.source.duration || "" } })}
            />
          );
        })}
        {!routine.length && <Empty text="오늘 루틴 없음" />}
      </Section>
      <Section title="빠른 시작">
        <Row marker="♪" title="피아노 세션 기록" subtitle="곡 또는 테크닉 선택" right={<Pill tone="blue">시작</Pill>} onClick={() => p.setScreen({ type: "piano-session" })} />
        <Row marker="□" title="운동 세션 기록" subtitle="운동 항목 선택" right={<Pill tone="green">시작</Pill>} onClick={() => p.setScreen({ type: "exercise-session" })} />
      </Section>
      <Section title="오늘 완료한 세션">
        {todayPiano.sort(byDateDesc).map((session) => <Row key={session.id} marker="♪" title={p.pianoItemName(session) || "피아노"} subtitle={`${minText(session.duration)} · ${session.feeling || session.note || "메모 없음"}`} />)}
        {todayExercise.sort(byDateDesc).map((session) => {
          const exercise = p.exerciseMap[session.exerciseId];
          return <Row key={session.id} marker="□" title={exercise ? exercise.name : "운동"} subtitle={`${exerciseSummary(session)} · ${session.feeling || session.note || "메모 없음"}`} />;
        })}
        {!todayPiano.length && !todayExercise.length && <Empty text="아직 완료한 세션 없음" />}
      </Section>
    </>
  );
}

  );
}
function PianoPieceRow({ piece, sessions, onRecord }) {
  const minutes = sum(sessions, (session) => session.duration);
  return <Row marker="♪" title={piece.title} subtitle={`${piece.composer || "작곡가 미정"} · ${piece.currentSection || "구간 없음"}`} right={<span className="mono">{minText(minutes)}</span>} onClick={onRecord} />;
}
function TechniqueRow({ technique, sessions, onRecord }) {
  const minutes = sum(sessions, (session) => session.duration);
  const current = Number(technique.currentBPM) || Math.max(0, ...sessions.map((s) => Number(s.bpm) || 0));
  const target = Number(technique.targetBPM) || 0;
  return (
    <Row marker="♪" title={technique.title} subtitle={`${technique.category} · ${current}/${target} BPM`} right={<span className="mono">{minText(minutes)}</span>} onClick={onRecord}>
      <Progress value={target ? Math.round(current / target * 100) : 0} />
    </Row>
  );
}
function PianoPieceLibrary(p) {
  return (

      {p.techniques.map((technique) => <Row key={technique.id} marker="♪" title={technique.title} subtitle={`${technique.category} · ${technique.currentBPM || 0}/${technique.targetBPM || 0} BPM`} right={<Pill tone={statusClass(technique.status)}>{PIANO_STATUS[technique.status] || technique.status}</Pill>} onClick={() => p.setScreen({ type: "technique-form", item: technique })} />)}

function PianoSessionList(p) {

          </Section>
        </>
      )}
      {p.exerciseView === "library" && (
        <Section title="운동 항목 라이브러리" action={<button className="section-action" onClick={() => p.setScreen({ type: "exercise-form" })}>+ 새 항목</button>}>
          {p.exercises.map((exercise) => <Row key={exercise.id} marker="□" title={exercise.name} subtitle={`${exercise.category} · 단위 ${exercise.unit}`} right={<Pill tone={statusClass(exercise.status)}>{EXERCISE_STATUS[exercise.status] || exercise.status}</Pill>} onClick={() => p.setScreen({ type: "exercise-form", item: exercise })} />)}
        </Section>

          {p.exerciseSessions.slice().sort(byDateDesc).slice(0, 30).map((session) => {
            const exercise = p.exerciseMap[session.exerciseId];
            return <Row key={session.id} marker="□" title={exercise ? exercise.name : "삭제된 운동"} subtitle={`${shortDate(session.date)} · ${exerciseSummary(session)} · ${session.feeling || session.note || "메모 없음"}`} />;
          })}
        </Section>
      )}
    </>
  );

function routineExerciseText(item) {
  const parts = [];
  if (item.sets) parts.push(`${item.sets}세트`);
  if (item.reps) parts.push(`${item.reps}회`);
  if (item.duration) parts.push(`${item.duration}분`);
  return parts.join(" · ") || "자유 기록";
}
function exerciseSummary(session) {
  const parts = [];
  if (session.sets) parts.push(`${session.sets}세트`);
  if (session.reps) parts.push(`${session.reps}회`);
  if (session.weight) parts.push(`${session.weight}kg`);
  if (session.duration) parts.push(`${session.duration}분`);
  if (session.distance) parts.push(`${session.distance}km`);
  return parts.join(" · ") || "기록";
}

function RecordView(p) {
  const ym = monthKey(parseDate(p.calendarAnchor));
  const dates = p.calendarMode === "week" ? weekDates(p.calendarAnchor) : monthDates(ym);
  const weekReview = p.reviews.find((review) => review.weekStart === p.ws);
  const countForDate = (date) => p.pianoSessions.filter((s) => s.date === date).length + p.exerciseSessions.filter((s) => s.date === date).length;
  return (
    <>
      <PageHeader icon="📅" title="기록" subtitle={`이번 주 피아노 ${minText(p.weekPianoMinutes)} · 운동 ${p.weekExerciseSessions.length}회`} />
      <div className="stat-grid">
        <div className="stat"><div className="stat-value">{minText(p.weekPianoMinutes)}</div><div className="stat-label">피아노</div></div>
        <div className="stat"><div className="stat-value">{p.weekExerciseSessions.length}</div><div className="stat-label">운동</div></div>
        <div className="stat"><div className="stat-value">{p.streak}</div><div className="stat-label">연속일</div></div>
      </div>
      <Tabs value={p.calendarMode} onChange={p.setCalendarMode} items={[{ value: "week", label: "주간" }, { value: "month", label: "월간" }]} />
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "0 0 12px" }}>

        <div style={{ fontSize: 14, fontWeight: 650 }}>{p.calendarMode === "week" ? `${shortDate(dates[0])} - ${shortDate(dates[6])}` : monthTitle(ym)}</div>
        <button className="button ghost" onClick={() => p.setCalendarAnchor(shiftDate(p.calendarAnchor, p.calendarMode === "week" ? 7 : 30))}>→</button>
      </div>
      <div className="calendar">
        {DAYS.map((day) => <div key={day} className="calendar-head">{day}</div>)}

          );

      <Section title="주간 리뷰">
        <Row marker="□" title={weekReview ? "이번 주 리뷰" : "작성하기"} subtitle={weekReview ? (weekReview.win || weekReview.text || weekReview.focus || "작성된 리뷰") : "아직 작성된 리뷰 없음"} right={<Pill>{weekReview ? "수정" : "작성"}</Pill>} onClick={() => p.setScreen({ type: "review-form", item: weekReview || { weekStart: p.ws, win: "", focus: "", memo: "" } })} />
      </Section>
      <Section title="지난 리뷰">
        {p.reviews.slice().sort((a, b) => (b.weekStart || "").localeCompare(a.weekStart || "")).slice(0, 5).map((review) => <Row key={review.id} marker="□" title={review.weekStart ? fullDate(review.weekStart) : "날짜 없음"} subtitle={(review.win || review.text || review.focus || review.memo || "").slice(0, 70) || "내용 없음"} onClick={() => p.setScreen({ type: "review-form", item: { ...review, win: review.win || review.text || "" } })} />)}
        {!p.reviews.length && <Empty text="지난 리뷰 없음" />}

    </>
  );

  return (

function DataSettings(p) {
  const exportBackup = () => {
    const data = {};
    ALL_BACKUP_KEYS.forEach((key) => { data[key] = readJSON(key, null); });
    const backup = { schemaVersion: 3, exportedAt: new Date().toISOString(), appVersion: "piano-fitness-redesign", data };
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const filename = `opus-flow-backup-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}.json`;
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };
  const importBackup = (event) => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      let backup;
      try { backup = JSON.parse(ev.target.result); } catch (error) { alert("파일을 읽을 수 없습니다"); return; }
      if (!backup || !backup.data || typeof backup.data !== "object" || ![1,2,3].includes(Number(backup.schemaVersion))) {
        alert("지원하지 않는 백업 파일입니다");
        return;
      }
      if (!confirm("현재 데이터가 백업 파일 내용으로 교체됩니다. 계속하시겠어요?")) return;
      LEGACY_KEYS.forEach((key) => {
        if (Object.prototype.hasOwnProperty.call(backup.data, key)) writeJSON(key, backup.data[key]);
      });
      writeJSON(KEYS.pieces, backup.data[KEYS.pieces] || backup.data["of3-pieces"] || defPieces);
      writeJSON(KEYS.techniques, backup.data[KEYS.techniques] || backup.data["of3-techniques"] || defTechniques);
      writeJSON(KEYS.pianoSessions, backup.data[KEYS.pianoSessions] || migrateOldPianoSessions(backup.data) || []);
      writeJSON(KEYS.exercises, backup.data[KEYS.exercises] || defExercises);
      writeJSON(KEYS.exerciseSessions, backup.data[KEYS.exerciseSessions] || []);
      writeJSON(KEYS.settings, backup.data[KEYS.settings] || defSettings);
      location.reload();
    };
    reader.readAsText(file);
    event.target.value = "";
  };
  return (
    <>
      <Section title="데이터 요약">
        <Row marker="♪" title={`피아노 곡 ${p.pieces.length}개 · 테크닉 ${p.techniques.length}개`} subtitle={`피아노 세션 ${p.pianoSessions.length}개`} />
        <Row marker="□" title={`운동 항목 ${p.exercises.length}개`} subtitle={`운동 세션 ${p.exerciseSessions.length}개`} />
        <Row marker="📅" title={`리뷰 ${p.reviews.length}개`} subtitle={`마지막 활동 ${p.lastActivity ? fullDate(p.lastActivity) : "없음"}`} />
      </Section>
      <Section title="백업/복원">
        <Row marker="↓" title="백업 내보내기" subtitle="schemaVersion 3 JSON" onClick={exportBackup} />
        <div className="row" style={{ cursor: "default" }}>
          <div className="marker">↑</div>
          <div className="row-main"><div className="row-title">백업 불러오기</div><div className="row-sub">기존 v1/v2 백업 호환</div></div>
          <label className="button">선택<input type="file" accept="application/json,.json" style={{ display: "none" }} onChange={importBackup} /></label>
        </div>
      </Section>
    </>
  );
}
function migrateOldPianoSessions(data) {
  const pieceSessions = data["of3-piece-sessions"];
  const techniqueSessions = data["of3-technique-sessions"];
  if (!Array.isArray(pieceSessions) && !Array.isArray(techniqueSessions)) return null;
  return [
    ...(Array.isArray(pieceSessions) ? pieceSessions.map((s) => ({ id: s.id || uid(), date: s.date, type: "piece", targetId: s.pieceId, duration: s.duration, section: s.section || "", bpm: "", repetitions: "", note: s.note || "", feeling: s.feeling || "" })) : []),
    ...(Array.isArray(techniqueSessions) ? techniqueSessions.map((s) => ({ id: s.id || uid(), date: s.date, type: "technique", targetId: s.techniqueId, duration: s.duration, section: "", bpm: s.bpm || "", repetitions: s.repetitions || "", note: s.note || "", feeling: s.feeling || "" })) : []),
  ];
}

  return (
    <>
      <PageHeader icon="🎹" title="피아노 루틴 추가" />
      <RoutineCommon form={form} setForm={setForm} />
      <Field label="종류"><select className="select" value={form.kind} onChange={(e) => setForm({ ...form, kind: e.target.value, targetId: e.target.value === "piece" ? (pieces[0] && pieces[0].id || "") : (techniques[0] && techniques[0].id || "") })}><option value="piece">곡</option><option value="technique">테크닉</option></select></Field>
      <Field label="항목"><select className="select" value={form.targetId} onChange={(e) => setForm({ ...form, targetId: e.target.value })}>{targets.map((item) => <option key={item.id} value={item.id}>{item.title}</option>)}</select></Field>
      <Field label="목표 시간"><input className="input" type="number" value={form.duration} onChange={(e) => setForm({ ...form, duration: e.target.value })} /></Field>
      <button className="button full" onClick={save}>추가</button>
    </>
  );
}
function ExerciseRoutineForm({ exercises, settings, updateSettings, onClose }) {
  const [form, setForm] = useState({ day: 1, exerciseId: exercises[0] && exercises[0].id || "", sets: "", reps: "", duration: "" });
  const save = () => {
    updateSettings({ exerciseRoutine: [...settings.exerciseRoutine, { ...form, id: uid(), sets: numberOrEmpty(form.sets), reps: numberOrEmpty(form.reps), duration: numberOrEmpty(form.duration) }] });
    onClose();
  };
  return (
    <>
      <PageHeader icon="🏃" title="운동 루틴 추가" />
      <RoutineCommon form={form} setForm={setForm} />
      <Field label="운동"><select className="select" value={form.exerciseId} onChange={(e) => setForm({ ...form, exerciseId: e.target.value })}>{exercises.map((item) => <option key={item.id} value={item.id}>{item.name}</option>)}</select></Field>
      <div className="inline-fields"><Field label="세트"><input className="input" type="number" value={form.sets} onChange={(e) => setForm({ ...form, sets: e.target.value })} /></Field><Field label="반복/초"><input className="input" type="number" value={form.reps} onChange={(e) => setForm({ ...form, reps: e.target.value })} /></Field></div>
      <Field label="시간"><input className="input" type="number" value={form.duration} onChange={(e) => setForm({ ...form, duration: e.target.value })} /></Field>
      <button className="button full" onClick={save}>추가</button>
    </>
  );
}
function RoutineCommon({ form, setForm }) {
  return <Field label="요일"><select className="select" value={form.day} onChange={(e) => setForm({ ...form, day: Number(e.target.value) })}>{DAYS.map((day, index) => <option key={day} value={index}>{day}요일</option>)}</select></Field>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
